<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calculator</title>
  <style>
    /* Quick basic styling so it's usable */
    body { font-family: Arial, sans-serif; display:flex; justify-content:center; padding:40px; }
    .calculator { width:260px; border:1px solid #ccc; padding:12px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
    .display input { width:100%; height:40px; font-size:18px; padding:6px; box-sizing:border-box; }
    .row { display:flex; gap:8px; margin-top:8px; }
    .row input[type="button"]{ flex:1; height:40px; font-size:16px; }
    .operator { background:#eee; }
    .equal { background:#4caf50; color:white; flex:1.5; }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <!-- Use id so we can reliably access the input -->
      <input id="display" type="text" value="" readonly />
    </div>

    <div class="row">
      <input type="button" value="AC" class="operator" onclick="clearAll()" />
      <input type="button" value="DC" class="operator" onclick="deleteLast()" />
      <input type="button" value="." class="operator" onclick="press('.')" />
      <input type="button" value="/" class="operator" onclick="press('/')" />
    </div>

    <div class="row">
      <input type="button" value="7" onclick="press('7')" />
      <input type="button" value="8" onclick="press('8')" />
      <input type="button" value="9" onclick="press('9')" />
      <input type="button" value="*" class="operator" onclick="press('*')" />
    </div>

    <div class="row">
      <input type="button" value="4" onclick="press('4')" />
      <input type="button" value="5" onclick="press('5')" />
      <input type="button" value="6" onclick="press('6')" />
      <input type="button" value="-" class="operator" onclick="press('-')" />
    </div>

    <div class="row">
      <input type="button" value="1" onclick="press('1')" />
      <input type="button" value="2" onclick="press('2')" />
      <input type="button" value="3" onclick="press('3')" />
      <input type="button" value="+" class="operator" onclick="press('+')" />
    </div>

    <div class="row">
      <input type="button" value="00" onclick="press('00')" />
      <input type="button" value="0" onclick="press('0')" />
      <input type="button" value="=" class="equal operator" onclick="calculate()" />
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function press(char) {
      // Append character to display
      display.value += char;
    }

    function clearAll() {
      display.value = '';
    }

    function deleteLast() {
      // Remove the last character
      display.value = display.value.slice(0, -1);
    }

    function calculate() {
      const expr = display.value;
      if (!expr) return;
      try {
        // NOTE: using eval for a simple calculator. For production consider parsing or validating.
        const result = Function('"use strict"; return (' + expr + ')')();
        display.value = String(result);
      } catch (e) {
        alert('Error: expression not valid');
      }
    }
  </script>
</body>
</html>
